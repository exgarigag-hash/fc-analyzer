name: collect
on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼
concurrency:          # 이전 실행이 안 끝났으면 겹쳐 돌지 않게
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy "psycopg[binary]"
      - run: python collector.py
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_NICKNAMES: ${{ vars.SEED_NICKNAMES }}
          MAX_CALLS: ${{ vars.MAX_CALLS || '900' }}
